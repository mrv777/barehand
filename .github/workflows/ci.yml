# CI for the Barehand plugin. Unit tests only: no QEMU, no model calls, no network beyond the checkout.
#
# What was verified locally (macOS, Python 3.12.9): the whole suite passes in a virtualenv that has only
# pytest (9.2.0) and its own dependencies, with a Hermes checkout on PYTHONPATH; importing the Hermes
# modules the tests touch pulls in no third-party package. Not provable offline: the run on Linux itself
# (ubuntu-latest, Python from actions/setup-python), and the pytest version resolved by pip below.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # hermes-agent commit the suite was developed and checked against (no release tag exists for it).
  HERMES_SHA: 7cdf34e59b7e820456e1d148c6aeda236d5447b4

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_SHA }}
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest==9.2.0"
      - name: Run the unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: python -m pytest tests -q -m "not integration"

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile the plugin (needs no Hermes)
        run: python -m compileall -q barehand
